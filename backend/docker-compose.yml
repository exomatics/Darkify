services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      POSTGRESHOST: db
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - keys:/app/keys
      - uploads:/app/uploads

  db:
    image: postgres:16.3
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: ${POSTGRESUSER}
      POSTGRES_PASSWORD: ${POSTGRESPASSWORD}
      POSTGRES_DB: ${POSTGRESDATABASE}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRESUSER} -d ${POSTGRESDATABASE}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  pgdata:
  keys:
  uploads:
