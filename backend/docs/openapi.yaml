openapi: 3.1.0
info:
  title: Darkify API
  description: API for authentication and user management.
  version: 1.0.0

security:
  - bearerAuth: []

servers:
  - url: http://localhost:3000/api

paths:
  /health:
    get:
      tags: [System]
      summary: Health check
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ok, error]
                  db:
                    type: string
                    enum: [connected, disconnected]
        '503':
          description: Service unavailable
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [error]
                  db:
                    type: string
                    enum: [disconnected]

  /users/register:
    post:
      tags: [Auth]
      summary: Register new user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: User registered
          $ref: '#/components/responses/SuccessTokens'
        '400':
          $ref: '#/components/responses/ValidationError'

  /users/login:
    post:
      tags: [Auth]
      summary: Login user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: User authenticated
          $ref: '#/components/responses/SuccessTokens'
        '400':
          $ref: '#/components/responses/ValidationError'

  /users/refresh-token:
    post:
      tags: [Auth]
      summary: Issue new access token using refresh token
      security: []
      description: Requires a valid `refreshToken` cookie (httpOnly) set during login or register.
      responses:
        '200':
          description: Access token returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessToken'
        '400':
          $ref: '#/components/responses/ValidationError'

  /users/logout:
    post:
      tags: [Auth]
      summary: Logout current user
      description: Clears the `refreshToken` httpOnly cookie. The access token will expire naturally.
      responses:
        '200':
          $ref: '#/components/responses/SuccessStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/me:
    get:
      tags: [User]
      summary: Get current user info

      responses:
        '200':
          description: User info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfo'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [User]
      summary: Update current user info
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                visible_username:
                  type: string
                  maxLength: 25
                description:
                  type: string
                  maxLength: 1500
                  description: Artist bio. Only applicable when the user is an artist.

      responses:
        '200':
          description: User info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPreview'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      summary: Delete current user
      tags: [User]
      responses:
        '200':
          $ref: '#/components/responses/SuccessStatus'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /users/me/settings:
    get:
      tags: [User]
      summary: Get current user settings

      responses:
        '200':
          description: List of user settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSettings'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [User]
      summary: Update current user settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserSettings'
      responses:
        '200':
          description: List of user settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSettings'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /users/me/following:
    get:
      tags: [User]
      summary: Get users followed by current user
      parameters:
        - $ref: '#/components/parameters/PaginationLimitParameter'
        - $ref: '#/components/parameters/PaginationOffsetParameter'
      responses:
        '200':
          description: List of following users
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  offset:
                    type: integer
                  next:
                    type: ['integer', 'null']
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserPreview'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/{user_id}:
    get:
      tags: [User]
      summary: Get user info by ID
      security: []
      description: Public endpoint. When called with a valid Bearer token, the response includes `is_following` indicating whether the caller follows this user.
      parameters:
        - $ref: '#/components/parameters/UserIdParameter'
      responses:
        '200':
          description: User info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfo'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /users/follow/user/{user_id}:
    post:
      tags: [User]
      summary: Follow specified user

      parameters:
        - $ref: '#/components/parameters/UserIdParameter'
      responses:
        '200':
          $ref: '#/components/responses/SuccessStatus'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/unfollow/user/{user_id}:
    post:
      tags: [User]
      summary: Unfollow specified user

      parameters:
        - $ref: '#/components/parameters/UserIdParameter'
      responses:
        '200':
          $ref: '#/components/responses/SuccessStatus'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/follow/playlist/{playlistId}:
    post:
      tags: [User]
      summary: Follow specified playlist
      parameters:
        - $ref: '#/components/parameters/PlaylistIdParameter'
      responses:
        '200':
          $ref: '#/components/responses/SuccessStatus'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/unfollow/playlist/{playlistId}:
    post:
      tags: [User]
      summary: Unfollow specified playlist

      parameters:
        - $ref: '#/components/parameters/PlaylistIdParameter'
      responses:
        '200':
          $ref: '#/components/responses/SuccessStatus'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /users/me/avatar:
    get:
      tags: [User]
      summary: Get avatar url
      responses:
        '200':
          description: avatar url
          content:
            application/json:
              schema:
                type: object
                properties:
                  avatar_url:
                    type: string
                    format: uri-reference
    put:
      tags: [User]
      summary: Change avatar for current user
      requestBody:
        content:
          multipart/form-data:
            schema:
              properties:
                avatar:
                  type: string
                  format: binary
      responses:
        '200':
          description: Updated avatar url
          content:
            application/json:
              schema:
                type: object
                properties:
                  avatar_url:
                    type: ['string', 'null']
                    format: uri-reference
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/me/banner:
    put:
      tags: [User]
      summary: Change banner for current user (artists only)
      requestBody:
        content:
          multipart/form-data:
            schema:
              properties:
                banner:
                  type: string
                  format: binary
      responses:
        '200':
          description: Updated banner url
          content:
            application/json:
              schema:
                type: object
                properties:
                  banner_url:
                    type: ['string', 'null']
                    format: uri-reference
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/me/turn-to-artist:
    post:
      tags: [User]
      summary: Convert current user account to an artist account
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                description:
                  type: string
                  maxLength: 1500
                banner:
                  type: ['string', 'null']
                  format: binary
      responses:
        '200':
          $ref: '#/components/responses/SuccessStatus'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/follow/album/{albumId}:
    post:
      tags: [User]
      summary: Follow specified album
      parameters:
        - $ref: '#/components/parameters/AlbumIdParameter'
      responses:
        '200':
          $ref: '#/components/responses/SuccessStatus'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/unfollow/album/{albumId}:
    post:
      tags: [User]
      summary: Unfollow specified album
      parameters:
        - $ref: '#/components/parameters/AlbumIdParameter'
      responses:
        '200':
          $ref: '#/components/responses/SuccessStatus'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/follow/single/{singleId}:
    post:
      tags: [User]
      summary: Follow specified single
      parameters:
        - $ref: '#/components/parameters/SingleIdParameter'
      responses:
        '200':
          $ref: '#/components/responses/SuccessStatus'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/unfollow/single/{singleId}:
    post:
      tags: [User]
      summary: Unfollow specified single
      parameters:
        - $ref: '#/components/parameters/SingleIdParameter'
      responses:
        '200':
          $ref: '#/components/responses/SuccessStatus'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/follow/artist/{artistId}:
    post:
      tags: [User]
      summary: Follow specified artist
      parameters:
        - $ref: '#/components/parameters/ArtistIdParameter'
      responses:
        '200':
          $ref: '#/components/responses/SuccessStatus'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /users/unfollow/artist/{artistId}:
    post:
      tags: [User]
      summary: Unfollow specified artist
      parameters:
        - $ref: '#/components/parameters/ArtistIdParameter'
      responses:
        '200':
          $ref: '#/components/responses/SuccessStatus'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /users/me/events/played:
    put:
      tags: [User]
      summary: Record that the user played something (updates last-played date)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event_data]
              properties:
                event_data:
                  oneOf:
                    - type: object
                      required: [section, playlist_id]
                      properties:
                        section:
                          type: string
                          enum: ['playlists']
                        playlist_id:
                          type: string
                          format: uuid
                    - type: object
                      required: [section, album_id]
                      properties:
                        section:
                          type: string
                          enum: ['albums']
                        album_id:
                          type: string
                          format: uuid
                    - type: object
                      required: [section, track_id]
                      properties:
                        section:
                          type: string
                          enum: ['singles']
                        track_id:
                          type: string
                          format: uuid
      responses:
        '200':
          $ref: '#/components/responses/SuccessStatus'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /users/me/password:
    put:
      tags: [User]
      summary: Change current user password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password:
                  type: string
                  minLength: 8
                  maxLength: 20
                new_password:
                  type: string
                  minLength: 8
                  maxLength: 20
      responses:
        '200':
          $ref: '#/components/responses/SuccessStatus'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/me/followers:
    get:
      tags: [User]
      summary: Get users that follow the current user
      parameters:
        - $ref: '#/components/parameters/PaginationLimitParameter'
        - $ref: '#/components/parameters/PaginationOffsetParameter'
      responses:
        '200':
          description: List of followers
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  offset:
                    type: integer
                  next:
                    type: ['integer', 'null']
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserPreview'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /tracks/:
    get:
      tags: [Track]
      summary: Get track info by ID
      parameters:
        - in: query
          name: trackId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          $ref: '#/components/responses/TrackInfoResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Track]
      summary: Upload track
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PostTrackRequest'
      responses:
        '200':
          $ref: '#/components/responses/TrackInfoResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /tracks/{trackId}:
    put:
      tags: [Track]
      summary: Update trackInfo by id
      parameters:
        - $ref: '#/components/parameters/TrackIdParameter'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PutTrackRequest'

      responses:
        '200':
          $ref: '#/components/responses/TrackInfoResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      summary: Delete track by id
      tags: [Track]
      parameters:
        - $ref: '#/components/parameters/TrackIdParameter'
      responses:
        '200':
          $ref: '#/components/responses/SuccessStatus'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /tracks/search/{trackName}:
    get:
      summary: Get all tracks by trackName. Case insensitive
      tags: [Track]
      parameters:
        - $ref: '#/components/parameters/NameParameter'
        - $ref: '#/components/parameters/PaginationLimitParameter'
        - $ref: '#/components/parameters/PaginationOffsetParameter'
      responses:
        '200':
          description: array of trackInfo
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  offset:
                    type: integer
                  next:
                    type: ['integer', 'null']
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/TrackInfo'

        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /tracks/stream/{trackId}:
    get:
      summary: Get m3u8 file for streaming. Depends on user's chosen bitrate
      tags: [Track]
      parameters:
        - $ref: '#/components/parameters/TrackIdParameter'
      responses:
        '200':
          description: m3u8 playlist file
          content:
            application/vnd.apple.mpegurl:
              schema:
                type: string
                format: binary

  /tracks/{trackId}/lyrics:
    get:
      tags: [Track]
      summary: Get lyrics for a track
      parameters:
        - $ref: '#/components/parameters/TrackIdParameter'
      responses:
        '200':
          description: Track lyrics
          content:
            application/json:
              schema:
                type: object
                properties:
                  lyrics:
                    type: ['string', 'null']
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /tracks/next:
    post:
      tags: [Track]
      summary: Get the next song based on context (playlist, album, liked, artist-top10, releases, other)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [context, loop, shuffle, currentTrackId, index]
              properties:
                context:
                  type: string
                  enum: [playlist, album, liked, artist-top10, releases, other]
                  description: Playback context
                id:
                  type: string
                  format: uuid
                  description: Context entity ID (playlistId, albumId, or artistId). Optional for liked context.
                search:
                  type: string
                  description: Optional search string to filter tracks within context
                loop:
                  type: boolean
                  description: Whether to loop back to the beginning when end is reached
                shuffle:
                  type: boolean
                  description: Whether to pick a random next track
                currentTrackId:
                  type: string
                  format: uuid
                  description: The current track's ID
                index:
                  type: integer
                  minimum: 0
                  description: Current track's index in the queue
      responses:
        '200':
          description: Next track info
          content:
            application/json:
              schema:
                type: object
                properties:
                  track_id:
                    type: string
                    format: uuid
                  local_id:
                    type: ['string', 'null']
                    format: uuid
                    description: Playlist track ID or album ID depending on context
                  new_context:
                    type: string
                    enum: [playlist, album, liked, artist-top10, releases, other]
                  stopped:
                    type: boolean
                    description: Whether playback should stop (end of queue with no loop)
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /playlists/{playlistId}:
    get:
      tags: [Playlist]
      parameters:
        - $ref: '#/components/parameters/PlaylistIdParameter'
      responses:
        '200':
          $ref: '#/components/responses/PlaylistInfoResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [Playlist]
      parameters:
        - $ref: '#/components/parameters/PlaylistIdParameter'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maximum: 100
                description:
                  type: [string, 'null']
                  maximum: 300
      responses:
        '200':
          $ref: '#/components/responses/PlaylistInfoResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [Playlist]
      parameters:
        - $ref: '#/components/parameters/PlaylistIdParameter'
      responses:
        '200':
          $ref: '#/components/responses/SuccessStatus'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /playlists/{playlistId}/tracks:
    get:
      tags: [Playlist]
      parameters:
        - $ref: '#/components/parameters/PlaylistIdParameter'
        - $ref: '#/components/parameters/PaginationLimitParameter'
        - $ref: '#/components/parameters/PaginationOffsetParameter'
        - in: query
          name: sort
          schema:
            type: string
            description: Sort field. Default is order (custom sort).
            default: 'order'
            enum: [name, date_added, album, duration, artist, order]
        - $ref: '#/components/parameters/OrderParameter'
      responses:
        '200':
          description: array of playlist tracks information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaylistTrackInfo'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /playlists/{playlistId}/cover:
    get:
      tags: [Playlist]
      parameters:
        - $ref: '#/components/parameters/PlaylistIdParameter'
      responses:
        '200':
          $ref: '#/components/responses/PlaylistInfoResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [Playlist]
      parameters:
        - $ref: '#/components/parameters/PlaylistIdParameter'
      requestBody:
        content:
          multipart/form-data:
            schema:
              properties:
                cover:
                  type: string
                  format: binary
      responses:
        '200':
          $ref: '#/components/responses/PlaylistInfoResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /playlists:
    get:
      tags: [Playlist]
      parameters:
        - in: query
          name: search
          description: 'name of the playlist'
          schema:
            type: string
            maxLength: 100
        - $ref: '#/components/parameters/PaginationLimitParameter'
        - $ref: '#/components/parameters/PaginationOffsetParameter'
      responses:
        '200':
          description: Data of all playlists with playlistName. ILIKE
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: number
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        owner:
                          type: string
                        name:
                          type: string
                        description:
                          type: [string, 'null']
                        cover_url:
                          type: ['string', 'null']
                          format: uri-reference
                        ownerName:
                          type: string
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Playlist]
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name:
                  type: ['string', 'null']
                  maxLength: 100
                cover:
                  type: ['string', 'null']
                  format: binary
                description:
                  type: ['string', 'null']
                  maximum: 300
                restrictions:
                  type: ['string', 'null']
                  description: 'default restriction is private'
                  enum: [private, unlisted, public]
      responses:
        '200':
          description: Playlist information
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PlaylistInfo'
                  - type: object
                    properties:
                      id:
                        type: 'string'
                        format: uuid
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /playlists/add-track:
    post:
      tags: [Playlist]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                trackId:
                  type: string
                  format: uuid
