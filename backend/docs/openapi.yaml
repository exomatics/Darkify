openapi: 3.1.0
info:
  title: Darkify API
  description: API for authentication and user management.
  version: 1.0.0

security:
  - bearerAuth: []

servers:
  - url: http://localhost:3000/api

paths:
  /users/register:
    post:
      tags: [Auth]
      summary: Register new user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: User registered
          $ref: '#/components/responses/SuccessTokens'
        '400':
          $ref: '#/components/responses/ValidationError'

  /users/login:
    post:
      tags: [Auth]
      summary: Login user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: User authenticated
          $ref: '#/components/responses/SuccessTokens'
        '400':
          $ref: '#/components/responses/ValidationError'

  /users/refresh-token:
    post:
      tags: [Auth]
      summary: Issue new access token using refresh token

      responses:
        '200':
          description: Access token returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessToken'
        '400':
          $ref: '#/components/responses/ValidationError'

  /users/me:
    get:
      tags: [User]
      summary: Get current user info

      responses:
        '200':
          description: User info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfo'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [User]
      summary: Update current user info
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                visible_username:
                  type: string

      responses:
        '200':
          description: User info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPreview'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      summary: Delete current user
      tags: [User]
      responses:
        '200':
          $ref: '#/components/responses/SuccessStatus'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /users/me/settings:
    get:
      tags: [User]
      summary: Get current user settings

      responses:
        '200':
          description: List of user settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSettings'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [User]
      summary: Update current user settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserSettings'
      responses:
        '200':
          description: List of user settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSettings'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /users/me/following:
    get:
      tags: [User]
      summary: Get users followed by current user

      responses:
        '200':
          description: List of following users
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  offset:
                    type: integer
                  next:
                    type: ['integer', 'null']
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserPreview'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/{userId}:
    get:
      tags: [User]
      summary: Get user info by ID

      parameters:
        - $ref: '#/components/parameters/UserIdParameter'
      responses:
        '200':
          description: User info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfo'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/follow/user/{userId}:
    post:
      tags: [User]
      summary: Follow specified user

      parameters:
        - $ref: '#/components/parameters/UserIdParameter'
      responses:
        '200':
          $ref: '#/components/responses/SuccessStatus'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/unfollow/user/{userId}:
    post:
      tags: [User]
      summary: Unfollow specified user

      parameters:
        - $ref: '#/components/parameters/UserIdParameter'
      responses:
        '200':
          $ref: '#/components/responses/SuccessStatus'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/follow/playlist/{playlistId}:
    post:
      tags: [User]
      summary: Follow specified playlist
      parameters:
        - $ref: '#/components/parameters/PlaylistIdParameter'
      responses:
        '200':
          $ref: '#/components/responses/SuccessStatus'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/unfollow/playlist/{playlistId}:
    post:
      tags: [User]
      summary: Unfollow specified playlist

      parameters:
        - $ref: '#/components/parameters/PlaylistIdParameter'
      responses:
        '200':
          $ref: '#/components/responses/SuccessStatus'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /users/me/avatar:
    get:
      tags: [User]
      summary: Get avatar url
      responses:
        '200':
          description: avatar url
          content:
            application/json:
              schema:
                type: object
                properties:
                  avatar_url:
                    type: string
                    format: uri-reference
    put:
      tags: [User]
      summary: Change avatar for current user
      requestBody:
        content:
          multipart/form-data:
            schema:
              properties:
                avatar:
                  type: string
                  format: binary
  /me/events/played:
    post:
      tags: [User]
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  properties:
                    section:
                      type: string
                      default: 'playlists'
                    playlist_id:
                      type: string
                      format: uuid
                - type: object
                  properties:
                    section:
                      type: string
                      default: 'albums'
                    album_id:
                      type: string
                      format: uuid
                - type: object
                  properties:
                    section:
                      type: string
                      default: 'artists'
                    artist_id:
                      type: string
                      format: uuid
      responses:
        '200':
          $ref: '#/components/responses/SuccessStatus'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /tracks/:
    post:
      tags: [Track]
      summary: Upload track
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PostTrackRequest'
      responses:
        '200':
          $ref: '#/components/responses/TrackInfoResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /tracks/{trackId}:
    get:
      tags: [Track]
      summary: Get trackInfo by id
      parameters:
        - $ref: '#/components/parameters/TrackIdParameter'
      responses:
        '200':
          $ref: '#/components/responses/TrackInfoResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [Track]
      summary: Update trackInfo by id
      parameters:
        - $ref: '#/components/parameters/TrackIdParameter'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PutTrackRequest'

      responses:
        '200':
          $ref: '#/components/responses/TrackInfoResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      summary: Delete track by id
      tags: [Track]
      parameters:
        - $ref: '#/components/parameters/TrackIdParameter'
      responses:
        '200':
          $ref: '#/components/responses/SuccessStatus'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /tracks/search/{trackName}:
    get:
      summary: Get all tracks by trackName. Case insensitive
      tags: [Track]
      parameters:
        - $ref: '#/components/parameters/NameParameter'
        - $ref: '#/components/parameters/PaginationLimitParameter'
        - $ref: '#/components/parameters/PaginationOffsetParameter'
      responses:
        '200':
          description: array of trackInfo
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  offset:
                    type: integer
                  next:
                    type: ['integer', 'null']
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/TrackInfo'

        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /tracks/stream/{trackId}:
    get:
      summary: Get m3u8 file for streaming. Depends on user's chosen bitrate
      tags: [Track]
      parameters:
        - $ref: '#/components/parameters/TrackIdParameter'
      responses:
        '200':
          description: m3u8 playlist file
          content:
            application/vnd.apple.mpegurl:
              schema:
                type: string
                format: binary

  #   GET_PLAYLIST: `${API_BASE}/playlist/:playlistId`, xxxx
  #   GET_PLAYLIST_COVER: `${API_BASE}/playlist/cover/:playlistId`, xxxx
  #   GET_PLAYLIST_TRACKS: `${API_BASE}/playlist/tracks/:playlistId`, xxxx
  #   GET_PLAYLISTS: `${API_BASE}/playlist/search/:playlistName` xxxx,
  #   GET_ME_LIBRARY: `${API_BASE}/me/library`, // should be in user ----
  #   GET_LIKED_SONGS_INFO: `${API_BASE}/collection`, ----
  #   GET_LIKED_SONGS_TRACKS: `${API_BASE}/collection/tracks`, ----
  #   POST_PLAYLIST: `${API_BASE}/playlist`, xxxx
  #   //!!
  #   POST_ADD_TRACK: `${API_BASE}/playlist/add-track/:trackId`, xxxx
  #   POST_REMOVE_TRACK: `${API_BASE}/playlist/remove-track/:playlistTrackId`, xxxx
  #   //!!
  #   PUT_PLAYLIST_INFO: `${API_BASE}/playlist/:playlistId`, xxxx
  #   PUT_PLAYLIST_RESTRICTIONS: `${API_BASE}/playlist-restrictions/:playlistId`, xxxx
  #   PUT_PLAYLIST_COVER: `${API_BASE}/playlist/cover/:playlistId`, xxxx
  #   //!!
  #   PUT_PLAYLIST_REORDER: `${API_BASE}/playlist/reorder/`,
  #   //!!
  #   DELETE_PLAYLIST: `${API_BASE}/playlist/:playlistId`, xxxx
  /playlists/{playlistId}:
    get:
      tags: [Playlist]
      parameters:
        - $ref: '#/components/parameters/PlaylistIdParameter'
      responses:
        '200':
          $ref: '#/components/responses/PlaylistInfoResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [Playlist]
      parameters:
        - $ref: '#/components/parameters/PlaylistIdParameter'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maximum: 100
                description:
                  type: [string, 'null']
                  maximum: 300
      responses:
        '200':
          $ref: '#/components/responses/SuccessStatus'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [Playlist]
      parameters:
        - $ref: '#/components/parameters/PlaylistIdParameter'
      responses:
        '200':
          $ref: '#/components/responses/SuccessStatus'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /playlists/{playlistId}/tracks:
    get:
      tags: [Playlist]
      parameters:
        - $ref: '#/components/parameters/PlaylistIdParameter'
        - $ref: '#/components/parameters/PaginationLimitParameter'
        - $ref: '#/components/parameters/PaginationOffsetParameter'
      requestBody:
        description: sortBy order is default. album is not implemented yet. default order is DESC
        content:
          application/json:
            schema:
              type: object
              properties:
                sort:
                  type: object
                  properties:
                    sortBy:
                      type: string
                      default: 'order'
                      enum: [name, title, album, duration, order]
                    order:
                      type: string
                      default: 'DESC'
                      enum: [ASC, DESC]
      responses:
        '200':
          description: array of playlist tracks information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaylistTrackInfo'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /playlists/{playlistId}/cover:
    get:
      tags: [Playlist]
      parameters:
        - $ref: '#/components/parameters/PlaylistIdParameter'
      responses:
        '200':
          $ref: '#/components/responses/PlaylistInfoResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [Playlist]
      parameters:
        - $ref: '#/components/parameters/PlaylistIdParameter'
      requestBody:
        content:
          multipart/form-data:
            schema:
              properties:
                cover:
                  type: string
                  format: binary
      responses:
        '200':
          $ref: '#/components/responses/PlaylistInfoResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /playlists:
    get:
      tags: [Playlist]
      parameters:
        - in: query
          name: search
          schema:
            type: string
            maxLength: 100
        - $ref: '#/components/parameters/PaginationLimitParameter'
        - $ref: '#/components/parameters/PaginationOffsetParameter'
      responses:
        '200':
          description: Data of all playlists with playlistName. ILIKE
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    owner:
                      type: string
                    name:
                      type: string
                    description:
                      type: [string, 'null']
                    coverId:
                      type: string
                    ownerName:
                      type: string
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Playlist]
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maximum: 100
                description:
                  type: [string, 'null']
                  maximum: 300
                restrictions:
                  type: string
                  enum: [private, unlisted, public]
                cover:
                  type: string
                  format: binary
      responses:
        '200':
          description: Playlist information
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PlaylistInfo'
                  - type: object
                    properties:
                      id:
                        type: 'string'
                        format: uuid
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /playlists/add-track:
    post:
      tags: [Playlist]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                trackId:
                  type: string
                  format: uuid
                playlistId:
                  type: string
                  format: uuid
      responses:
        '200':
          description: 'playlistTrackId to remove track'
          content:
            application/json:
              schema:
                type: object
                properties:
                  playlistTrackId:
                    type: string
                    format: uuid
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /playlists/remove-track:
    post:
      tags: [Playlist]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                trackId:
                  type: string
                  format: uuid
                playlistTrackId:
                  type: string
                  format: uuid
      responses:
        '200':
          $ref: '#/components/responses/SuccessStatus'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /playlists/{playlistId}/restrictions:
    put:
      tags: [Playlist]
      parameters:
        - $ref: '#/components/parameters/PlaylistIdParameter'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                restrictions:
                  type: string
                  enum: [private, unlisted, public]
      responses:
        '200':
          $ref: '#/components/responses/PlaylistInfoResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /playlists/{playlistId}/reorder:
    put:
      tags: [Playlist]
      description: 'Reorder playlist`s custom order. Indexes must be exactly indexes, in other words start from 0. To reorder to 0 index, need to send toIndex 0. To reored to the last index, need to send toIndex -1 or the last existing index.'
      parameters:
        - $ref: '#/components/parameters/PlaylistIdParameter'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                fromIndex:
                  type: number
                  minimum: 0
                toIndex:
                  type: number
                  minimum: -1
      responses:
        '200':
          $ref: '#/components/responses/PlaylistInfoResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /me/library/playlists:
    get:
      tags: [Library]
      description: 'get all playlist from user library'
      parameters:
        - $ref: '#/components/parameters/PaginationLimitParameter'
        - $ref: '#/components/parameters/PaginationOffsetParameter'
      requestBody:
        description: sortBy order is default. album is not implemented yet
        content:
          application/json:
            schema:
              type: object
              properties:
                sort:
                  type: object
                  properties:
                    sortBy:
                      type: string
                      default: 'order'
                      enum: [name, title, album, duration, order]
                    order:
                      type: string
                      default: 'DESC'
                      enum: [ASC, DESC]
      responses:
        '200':
          description: array of library playlists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaylistLibraryInfo'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me/library/playlists/{playlistId}/reorder:
    get:
      tags: [Library]
      parameters:
        - $ref: '#/components/parameters/PlaylistIdParameter'
      description: sortBy order is default. album is not implemented yet
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderRequestBody'
      responses:
        '200':
          $ref: '#/components/responses/SuccessStatus'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          $ref: '#/components/schemas/Password'
    Bitrate:
      description: User's bitrate option. Can be low, normal, high, veryHigh or auto.
      type: string
      enum: [low, normal, high, veryHigh, auto]
    LoginRequest:
      type: object
      required: [password]
      properties:
        username:
          type: string
        email:
          type: string
          format: email
        password:
          $ref: '#/components/schemas/Password'

    AccessToken:
      type: object
      properties:
        accessToken:
          $ref: '#/components/schemas/Token'

    Token:
      type: object
      properties:
        token:
          type: string
        expires:
          type: string

    Password:
      type: string
      format: password
      minLength: 8
      maxLength: 20

    UserInfo:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        visible_username:
          type: string
        is_artist:
          type: boolean
        avatar_url:
          type: string
          format: uri-reference
        followers:
          type: integer
    UserSettings:
      type: object
      properties:
        bitrate:
          $ref: '#/components/schemas/Bitrate'
    UserPreview:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        visible_username:
          type: string
        avatar_url:
          type: string
          format: uri-reference
    TrackInfo:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 100
        artists:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              visible_username:
                type: string
        cover_url:
          type: string
          format: uri-reference
        lyrics:
          type: [string, 'null']
        play_count:
          type: number
        creation_date:
          type: string
          format: date
        deleted:
          type: boolean
        duration:
          type: number
          description: 'Duration of a song in seconds'
    PostTrackRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        cover:
          type: string
          format: binary
        track:
          type: string
          format: binary
        artists:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              visible_username:
                type: string
        lyrics:
          type: [string, 'null']
    PutTrackRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        lyrics:
          type: [string, 'null']
        artists:
          type: array
          items:
            type: string
            format: uuid
        cover:
          type: string
          format: binary
    PlaylistInfo:
      type: object
      properties:
        owner:
          type: object
          properties:
            id:
              type: string
              format: uuid
            visible_username:
              type: string
        name:
          type: string
          maximum: 100
        description:
          type: [string, 'null']
          maximum: 300
        coverUrl:
          type: string
          format: uri-reference
        totalDuration:
          type: number
        songsCount:
          type: number
        isOwner:
          type: boolean
        restrictions:
          type: string
          enum: [private, unlisted, public]
        type:
          type: string
          enum: ['general', 'liked_songs', 'album']
    PlaylistTrackInfo:
      type: array
      items:
        type: object
        properties:
          name:
            type: string
            maxLength: 100
          deleted:
            type: boolean
          duration:
            type: number
            description: 'Duration of a song in seconds'
          trackId:
            type: string
            format: uuid
          playlistTrackId:
            type: string
            format: uuid
          dateAdded:
            type: string
            format: date
          artist:
            type: object
            properties:
              id:
                type: string
                format: uuid
              visible_username:
                type: string
                maxLength: 25
    PlaylistLibraryInfo:
      type: array
      items:
        type: object
        properties:
          date_played:
            type: string
            format: date
          date_added:
            type: string
            format: date
          playlists:
            type: object
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
                maxLength: 100
              owner:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  visible_username:
                    type: string
              coverUrl:
                type: string
                format: uri-reference
              description:
                type: [string, 'null']
                maximum: 300
              type:
                type: string
                enum: ['general', 'liked_songs', 'album']
    ReorderRequestBody:
      type: object
      properties:
        fromIndex:
          type: number
          minimum: 0
        toIndex:
          type: number
          minimum: -1
  parameters:
    UserIdParameter:
      in: path
      name: user_id
      required: true
      schema:
        type: string
        format: uuid
    PaginationLimitParameter:
      in: query
      name: limit
      schema:
        type: number
        maximum: 100
        default: 5
    PaginationOffsetParameter:
      in: query
      name: offset
      schema:
        type: number
        default: 0

    PlaylistIdParameter:
      in: path
      name: playlistId
      required: true
      schema:
        type: string
    TrackIdParameter:
      in: path
      name: trackId
      required: true
      schema:
        type: string
        format: uuid
    NameParameter:
      in: path
      name: trackName
      required: true
      schema:
        type: string
        maxLength: 100

  responses:
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string

    Unauthorized:
      description: Unauthorized or invalid token
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string

    SuccessTokens:
      description: Successful response with both access and refresh tokens
      content:
        application/json:
          schema:
            description: access token
            $ref: '#/components/schemas/Token'
      headers:
        Set-Cookie:
          schema:
            description: refresh token
            $ref: '#/components/schemas/Token'

    SuccessStatus:
      description: Successful response with no data

    TrackInfoResponse:
      description: trackInfo
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TrackInfo'
    PlaylistInfoResponse:
