                    type: string
                    maximum: 100
                  published:
                    type: boolean
                  date_released:
                    type: string
                    format: date
                  cover_url:
                    type: string
                    format: uri-reference

        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /artists/{artistId}:
    get:
      tags: [Artist]
      parameters:
        - $ref: '#/components/parameters/ArtistIdParameter'
      responses:
        '200':
          description: Artist info
          content:
            application/json:
              schema:
                type: object
                properties:
                  banner_url:
                    type: [string, 'null']
                    format: uri-reference
                  avatar_url:
                    type: [string, 'null']
                    format: uri-reference
                  followers_count:
                    type: number
                  listening_count:
                    type: number
                  is_following:
                    type: boolean
                  liked_songs_count:
                    type: number
                  name:
                    type: string
                    maximum: 100
                  description:
                    type: string
                    maximum: 1500
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /artists/{artistId}/liked:
    get:
      tags: [Artist]
      parameters:
        - $ref: '#/components/parameters/ArtistIdParameter'
        - $ref: '#/components/parameters/PaginationLimitParameter'
        - $ref: '#/components/parameters/PaginationOffsetParameter'
      responses:
        '200':
          description: User's liked songs from Artist
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: number
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/PlaylistTrackInfo'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /artists/{artistId}/albums:
    get:
      tags: [Artist]
      parameters:
        - $ref: '#/components/parameters/ArtistIdParameter'
        - $ref: '#/components/parameters/PaginationLimitParameter'
        - $ref: '#/components/parameters/PaginationOffsetParameter'
      responses:
        '200':
          description: Albums of the artist
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: number
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ArtistAlbumInfo'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /artists/{artistId}/singles:
    get:
      tags: [Artist]
      parameters:
        - $ref: '#/components/parameters/ArtistIdParameter'
        - $ref: '#/components/parameters/PaginationLimitParameter'
        - $ref: '#/components/parameters/PaginationOffsetParameter'
      responses:
        '200':
          description: Singles of the artist
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: number
                  items:
                    $ref: '#/components/schemas/ArtistSingleInfo'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /artists/{artistId}/top-tracks:
    get:
      tags: [Artist]
      parameters:
        - $ref: '#/components/parameters/ArtistIdParameter'
      responses:
        '200':
          description: Artist top tracks
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: number
                  items:
                    $ref: '#/components/schemas/TrackInfo'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /artists/{artistId}/popular:
    get:
      tags: [Artist]
      parameters:
        - $ref: '#/components/parameters/ArtistIdParameter'
      responses:
        '200':
          description: most popular albums and singles of the Artist.
          content:
            application/json:
              schema:
                type: object
                properties:
                  albums:
                    type: array
                    items:
                      $ref: '#/components/schemas/ArtistAlbumInfo'
                  singles:
                    type: array
                    items:
                      $ref: '#/components/schemas/ArtistSingleInfo'

        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /artists/{artistId}/discography:
    get:
      tags: [Artist]
      parameters:
        - $ref: '#/components/parameters/ArtistIdParameter'
      responses:
        '200':
          description: Albums and singles of the artist, sorted by date_released
          content:
            application/json:
              schema:
                type: object
                properties:
                  albums:
                    type: array
                    items:
                      $ref: '#/components/schemas/ArtistAlbumInfo'
                  singles:
                    type: array
                    items:
                      $ref: '#/components/schemas/ArtistSingleInfo'

        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          $ref: '#/components/schemas/Password'
    Bitrate:
      description: User's bitrate option. Can be low, normal, high, veryHigh or auto.
      type: string
      enum: [low, normal, high, veryHigh, auto]
    LoginRequest:
      type: object
      required: [password]
      properties:
        username:
          type: string
        email:
          type: string
          format: email
        password:
          $ref: '#/components/schemas/Password'

    AccessToken:
      type: object
      properties:
        accessToken:
          $ref: '#/components/schemas/Token'

    Token:
      type: object
      properties:
        token:
          type: string
        expires:
          type: string

    Password:
      type: string
      format: password
      minLength: 8
      maxLength: 20

    UserInfo:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        visible_username:
          type: string
        is_artist:
          type: boolean
        avatar_url:
          type: ['string', 'null']
          format: uri-reference
        followers:
          type: integer
        banner_url:
          type: ['string', 'null']
          format: uri-reference
          description: Only present when is_artist is true
        description:
          type: ['string', 'null']
          description: Artist bio. Only present when is_artist is true
        is_following:
          type: boolean
          description: Whether the authenticated caller follows this user. Only present when request is authenticated and caller is not the profile owner.
    UserSettings:
      type: object
      properties:
        bitrate:
          $ref: '#/components/schemas/Bitrate'
    UserPreview:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        visible_username:
          type: string
        avatar_url:
          type: string
          format: uri-reference
    TrackInfo:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 100
        artists:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              visible_username:
                type: string
        cover_url:
          type: ['string', 'null']
          format: uri-reference
        lyrics:
          type: [string, 'null']
        play_count:
          type: number
        album_id:
          type: ['string', 'null']
          format: uuid
        album:
          type: ['object', 'null']
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
        is_liked:
          type: boolean
        creation_date:
          type: string
          format: date
        deleted:
          type: boolean
        duration:
          type: number
          description: 'Duration of a song in seconds'
    PostTrackRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        cover:
          type: string
          format: binary
        track:
          type: string
          format: binary
        artists:
          type: string
          description: 'JSON-encoded array of artist UUIDs (excluding the uploader, who is added automatically). Example: ["uuid1","uuid2"]'
        albumId:
          type: string
          format: uuid
          description: Optional album to associate the track with at upload time.
        lyrics:
          type: [string, 'null']
    PutTrackRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        lyrics:
          type: [string, 'null']
        artists:
          type: array
          items:
            type: string
            format: uuid
        cover:
          type: string
          format: binary
    PlaylistInfo:
      type: object
      properties:
        owner:
          type: object
          properties:
            id:
              type: string
              format: uuid
            visible_username:
              type: string
        name:
          type: string
          maximum: 100
        description:
          type: [string, 'null']
          maximum: 300
        placeholder_url_covers:
          type: [array, 'null']
          description: 'only one or 4 urls or null if no covers on tracks'
          items:
            type: string
            format: uuid
        album:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
        cover_url:
          type: ['string', 'null']
          format: uri-reference
        totalDuration:
          type: number
        songsCount:
          type: number
        isOwner:
          type: boolean
        restrictions:
          type: string
          enum: [private, unlisted, public]
        type:
          type: string
          enum: ['general', 'liked_songs', 'album']
    PlaylistTrackInfo:
      type: object
      properties:
        total:
          type: number
        items:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                maxLength: 100
              deleted:
                type: boolean
              duration:
                type: number
                description: 'Duration of a song in seconds'
              album:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                    name:
                      type: string
              cover_url:
                type: ['string', 'null']
                format: uri-reference
              lyrics:
                type: [string, 'null']
              trackId:
                type: string
                format: uuid
              playlistTrackId:
                type: string
                format: uuid
              dateAdded:
                type: string
                format: date
              is_liked:
                type: boolean
              artists:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                    visible_username:
                      type: string
                      maxLength: 25
    AlbumTrackInfo:
      type: object
      properties:
        total:
          type: number
        items:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                maxLength: 100
              deleted:
                type: boolean
              duration:
                type: number
                description: 'Duration of a song in seconds'
              cover_url:
                type: ['string', 'null']
                format: uri-reference
              lyrics:
                type: [string, 'null']
              trackId:
                type: string
                format: uuid
              is_liked:
                type: boolean
              album_track_id:
                type: string
                format: uuid
              dateAdded:
                type: string
                format: date
              play_count:
                type: number
              artists:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                    visible_username:
                      type: string
                      maxLength: 25

    PlaylistLibraryInfo:
      type: array
      items:
        type: object
        properties:
          date_played:
            type: string
            format: date
          date_added:
            type: string
            format: date
          playlists:
            type: object
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
                maxLength: 100
              owner:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  visible_username:
                    type: string
              cover_url:
                type: ['string', 'null']
                format: uri-reference
              description:
                type: [string, 'null']
                maximum: 300
              placeholder_url_covers:
                type: [array, 'null']
                description: 'only one or 4 urls or null if no urls on tracks'
                items:
                  type: string
                  format: uuid
              type:
                type: string
                enum: ['general', 'liked_songs', 'album']
    LibraryInfo:
      type: object
      properties:
        playlists:
          allOf:
            - $ref: '#/components/schemas/PlaylistLibraryInfo'
        albums:
          type: array
        artists:
          type: array
    ArtistAlbumInfo:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maximum: 100
        count:
          type: number
        date_released:
          type: string
          format: date
        is_followed:
          type: boolean
        cover_url:
          type: ['string', 'null']
          format: uri-reference
    ArtistSingleInfo:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 100
        artists:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              visible_username:
                type: string
        cover_url:
          type: string
          format: uri-reference
        lyrics:
          type: [string, 'null']
        play_count:
          type: number
        album_id:
          type: string
          format: uuid
        is_liked:
          type: boolean
        date_released:
          type: string
          format: date
        deleted:
          type: boolean
        duration:
          type: number
          description: 'Duration of a song in seconds'
    AlbumInfo:
      type: object
      properties:
        owner:
          type: object
          properties:
            id:
              type: string
              format: uuid
            visible_username:
              type: string
        name:
          type: string
          maximum: 100
        cover_url:
          type: ['string', 'null']
          format: uri-reference
        totalDuration:
          type: number
        songsCount:
          type: number
        isOwner:
          type: boolean
        date_released:
          type: string
          format: date

    ReorderRequestBody:
      type: object
      properties:
        fromIndex:
          type: number
          minimum: 0
        toIndex:
          type: number
          minimum: -1
  parameters:
    UserIdParameter:
      in: path
      name: user_id
      required: true
      schema:
        type: string
        format: uuid
    PaginationLimitParameter:
      in: query
      name: limit
      schema:
        type: number
        maximum: 100
        default: 5
    PaginationOffsetParameter:
      in: query
      name: offset
      schema:
        type: number
        default: 0
    OrderParameter:
      in: query
      name: order
      schema:
        type: string
        default: 'DESC'
        enum: [ASC, DESC]

    PlaylistIdParameter:
      in: path
      name: playlistId
      required: true
      schema:
        type: string
    AlbumIdParameter:
      in: path
      name: albumId
      required: true
      schema:
        type: string
    TrackIdParameter:
      in: path
      name: trackId
      required: true
      schema:
        type: string
        format: uuid
    ArtistIdParameter:
      in: path
      name: artistId
      required: true
      schema:
        type: string
        format: uuid
    NameParameter:
      in: path
      name: trackName
      required: true
      schema:
        type: string
        maxLength: 100
    SingleIdParameter:
      in: path
      name: singleId
      required: true
      schema:
        type: string
        format: uuid
    ReleaseIdParameter:
      in: path
      name: releaseId
      required: true
      schema:
        type: string
        format: uuid

  responses:
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string

    Unauthorized:
      description: Unauthorized or invalid token
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string

    SuccessTokens:
      description: Successful response with both access and refresh tokens
      content:
        application/json:
          schema:
            description: access token
            $ref: '#/components/schemas/Token'
      headers:
        Set-Cookie:
          schema:
            description: refresh token
            $ref: '#/components/schemas/Token'

    NotFoundError:
      description: Resource not found
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string

    SuccessStatus:
      description: Successful response with no data

    TrackInfoResponse:
      description: trackInfo
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TrackInfo'
    PlaylistInfoResponse:
      description: Playlist information
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PlaylistInfo'
    AlbumInfoResponse:
      description: Album information
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AlbumInfo'
